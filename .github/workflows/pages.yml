name: Deploy PawSense to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore frontend source
        run: |
          cat pawsense-source.zip.part* > /tmp/pawsense-source.zip
          echo '286f2a1dcaff1d2c44408954a35ec6a06cc47e405c2ff61a096f9eece9d4680f  /tmp/pawsense-source.zip' | sha256sum --check
          mkdir frontend
          unzip -q /tmp/pawsense-source.zip -d frontend
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply interactive shoe and dog profile updates
        working-directory: frontend
        run: |
          python - <<'PY'
          import json,base64,shutil
          from pathlib import Path
          files=json.loads('{"src/main.tsx": "", "src/DogData.tsx": "", "src/Home.tsx": "", "src/Profile.tsx": "", "src/styles.css": "", "src/ShoeModel.tsx": "", "src/shoePalette.ts": "Ly8gUmVmZXJlbmNlIHBhbGV0dGU6IGNvcmFsLCBhbWJlciB5ZWxsb3csIG9yYW5nZSwgd2FybSBncmVlbiwgZGFyayBjb2NvYSwgcG9yY2VsYWluLCBibGFjay4KZXhwb3J0IGNvbnN0IHNob2VDb2xvcnM9WycjZjM2ZTc5JywnI2VkOWIxOScsJyNmZjgxMjYnLCcjNDU5YjQzJywnIzU5MzAxYScsJyNlOWU4ZTUnLCcjMDkwYTA5J107Cg==", "package.json": "", "package-lock.json": ""}')
          for name,data in files.items():
           Path(name).write_bytes(base64.b64decode(data))
          Path("public/models").mkdir(exist_ok=True)
          shutil.copyfile("../dog-shoe.glb","public/models/dog-shoe.glb")
          PY
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Optimize images and fonts
        working-directory: frontend
        run: |
          python -m pip install 'Pillow>=11,<14' 'fonttools[woff]>=4.60,<5'
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from fontTools import subset
          import json,re
          root=Path.cwd();assets=root/'public/assets';sources=list((root/'src').glob('*.tsx'))+list((root/'src').glob('*.css'))
          text=''.join(p.read_text() for p in sources);chars=set(text)|set(chr(c) for c in range(32,592));mapping={};before=after=0
          for path in assets.glob('*.png'):
           target=path.with_suffix('.webp');im=Image.open(path);limit=1920 if path.name=='welcome-source-1.png' else 1600
           im.thumbnail((limit,limit),Image.Resampling.LANCZOS)
           im.save(target,'WEBP',quality=88,method=6)
           if target.stat().st_size<path.stat().st_size:
            mapping[path.name]=target.name;before+=path.stat().st_size;after+=target.stat().st_size
          for path in list(assets.glob('*.otf'))+list(assets.glob('*.ttf')):
           target=path.with_suffix('.woff2');options=subset.Options();options.flavor='woff2'
           font=subset.load_font(str(path),options);subsetter=subset.Subsetter(options=options);subsetter.populate(unicodes=[ord(c) for c in chars]);subsetter.subset(font);subset.save_font(font,str(target),options)
           mapping[path.name]=target.name;before+=path.stat().st_size;after+=target.stat().st_size
          for path in sources:
           s=path.read_text()
           for old,new in mapping.items():s=s.replace('/assets/'+old,'/assets/'+new)
           if path.suffix=='.css':s=re.sub(r'@font-face\{(?!font-display:swap;)', '@font-face{font-display:swap;',s)
           path.write_text(s)
          # Keep the welcome screen eager; other page modules load when opened.
          p=root/'src/main.tsx';s=p.read_text()
          if 'lazy, Suspense' not in s:
           s=s.replace('useEffect, useState','useEffect, useState, lazy, Suspense')
           s=re.sub(r"import (\w+) from './(\w+)';",lambda m:m[0] if m[1] in ['Welcome','SwipeStart'] else f"const {m[1]} = lazy(() => import('./{m[2]}'));",s)
           s=s.replace('<View/>','<Suspense fallback={<div className="page-loading" role="status">加载中…</div>}><View/></Suspense>')
           p.write_text(s)
          report={'converted_source_bytes':before,'optimized_bytes':after,'savings_percent':round((1-after/before)*100,1),'mapping':mapping}
          (root/'outputs').mkdir(exist_ok=True);(root/'outputs/asset-optimization.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k!='mapping'}))
          PY
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: frontend/dist
      - name: Wait for artifact metadata
        run: sleep 20
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
